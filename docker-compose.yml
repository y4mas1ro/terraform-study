version: "3.8"

services:

  # ── 1. ministack (ローカルAWSエミュレータ) ────────────────────────────────
  ministack:
    image: ministackorg/ministack:latest
    ports:
      - "4566:4566"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import socket; s=socket.create_connection((\"localhost\",4566),timeout=2); s.close()'"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    restart: unless-stopped

  # ── 2. Terraform (Kinesis / DynamoDB / S3 を作成して終了) ─────────────────
  terraform:
    image: hashicorp/terraform:1.9
    depends_on:
      ministack:
        condition: service_healthy
    volumes:
      - ./terraform:/workspace
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "terraform init -input=false &&
       terraform apply -auto-approve -input=false"
    environment:
      - TF_VAR_aws_endpoint=http://ministack:4566

  # ── 3. Producer (Yahoo Finance → Kinesis) ────────────────────────────────
  producer:
    build:
      context: ./producer
    depends_on:
      terraform:
        condition: service_completed_successfully
    environment:
      - AWS_ENDPOINT_URL=http://ministack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - KINESIS_STREAM=stock-price-stream
      - SYMBOLS=AAPL,GOOGL,MSFT,TSLA
      - INTERVAL=3
    restart: unless-stopped

  # ── 4. Consumer (Kinesis → DynamoDB) ─────────────────────────────────────
  consumer:
    build:
      context: ./consumer
    depends_on:
      terraform:
        condition: service_completed_successfully
    environment:
      - AWS_ENDPOINT_URL=http://ministack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - KINESIS_STREAM=stock-price-stream
      - DYNAMODB_TABLE=stock-prices
    restart: unless-stopped

  # ── 5. Dashboard (Streamlit リアルタイムグラフ) ───────────────────────────
  dashboard:
    build:
      context: ./dashboard
    depends_on:
      terraform:
        condition: service_completed_successfully
    ports:
      - "8501:8501"
    environment:
      - AWS_ENDPOINT_URL=http://ministack:4566
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DYNAMODB_TABLE=stock-prices
      - SYMBOLS=AAPL,GOOGL,MSFT,TSLA
      - REFRESH_INTERVAL=5
    restart: unless-stopped
